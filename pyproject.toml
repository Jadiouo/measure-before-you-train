[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "animalbench"
version = "0.1.0"
description = "Code and result files for a prediction-first headroom test: how far simple rotation rules fall short of an upper bound in simulated drone formations"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy", "jax", "jaxlib"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
